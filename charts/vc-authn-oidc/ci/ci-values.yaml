autoscaling:
  enabled: false

acapy:
  autoscaling:
    enabled: false
  persistence:
    enabled: false
  postgres:
    persistence:
      enabled: false

mongodb:
  persistence:
    enabled: false
  # MongoDB 8.x does not start on the 6.19+ kernel used by GitHub runners (SERVER-121912)
  image:
    tag: "7.0"
